name: CI/CD Pipeline
on:
    push:
        branches:
            - main

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4
            
            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                    registry: ghcr.io
                    username: ${{ github.actor }}
                    password: ${{ secrets.GITHUB_TOKEN }}

            - name: Lowercase repository owner
              id: owner
              run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
            
            - name: build and push Docker image
              uses: docker/build-push-action@v6
              with:
                    context: .
                    push: true
                    tags: ghcr.io/${{ steps.owner.outputs.owner }}/tasker:${{ github.sha }}

    Deploy-to-EC2:
        runs-on: ubuntu-latest
        needs: build-and-deploy

        steps:
            - name: Lowercase repository owner
              id: owner
              run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Copy Helm chart to EC2
              uses: appleboy/scp-action@v0.1.7
              with:
                    host: ${{ secrets.EC2_HOST }}
                    username: ${{ secrets.EC2_USER }}
                    key: ${{ secrets.EC2_KEY }}
                    source: "tasker-chart"
                    target: "~/"

            - name: Deploy to K3s via Helm over SSH
              uses: appleboy/ssh-action@v1.0.0
              with:
                    host: ${{ secrets.EC2_HOST }}
                    username: ${{ secrets.EC2_USER }}
                    key: ${{ secrets.EC2_KEY }}
                    script: |
                        export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
                        
                        kubectl get nodes
                        
                        helm dependency update ~/tasker-chart

                        helm upgrade --install tasker ~/tasker-chart \
                        --set image.repository=ghcr.io/${{ steps.owner.outputs.owner }}/tasker \
                        --set image.tag=${{ github.sha }} \
                        --set-string db.password='${{ secrets.DB_PASSWORD }}' \
                        --set-string postgresql.auth.postgresPassword='${{ secrets.DB_PASSWORD }}' \
                        --timeout 2m \
                        --history-max 5